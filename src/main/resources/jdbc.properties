# 请把密码改成你本机 MySQL 的密码后再启动；不要把真实密码提交到 GitHub
jdbc.driver=com.mysql.cj.jdbc.Driver
jdbc.url=jdbc:mysql://localhost:3306/ssm_file?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
jdbc.username=root
jdbc.password=your_password

# 文件落盘根目录，使用系统属性拼接，禁止在代码里写死绝对路径
upload.base-dir=${user.home}/ssm-uploads
